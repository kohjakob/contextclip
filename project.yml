name: Contextclip
options:
  bundleIdPrefix: com.kohjakob
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Contextclip:
    type: application
    platform: macOS
    sources:
      - path: Sources/Contextclip
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Contextclip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kohjakob.contextclip
        PRODUCT_NAME: Contextclip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ContextclipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ContextclipTests
    dependencies:
      - target: Contextclip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  Contextclip:
    build:
      targets:
        Contextclip: all
        ContextclipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ContextclipTests
